# Unified Clarity release: one version tag push (v*) produces a single
# GitHub release with signed artifacts for macOS (Developer ID + notarized)
# and Windows (DigiCert KeyLocker EV, 2 metered signatures) plus a merged
# latest.json consumed by the auto-updater on both platforms.
#
# Trigger: git tag vX.Y.Z && git push origin vX.Y.Z
# The tag version must match tauri.conf.json / package.json.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Developer ID certificate into a temp keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, notarize
        run: npm run tauri build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify notarization
        run: spctl -a -vv src-tauri/target/release/bundle/macos/Clarity.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-artifacts
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up DigiCert KeyLocker client cert
        shell: bash
        run: |
          echo "$SM_CLIENT_CERT_FILE_B64" | base64 -d > /d/client_cert.p12
          echo "SM_CLIENT_CERT_FILE=D:\\client_cert.p12" >> "$GITHUB_ENV"
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE }}

      - name: Install DigiCert KeyLocker tools
        uses: digicert/ssm-code-signing@v1.0.1
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: KeyLocker healthcheck + cert sync
        shell: cmd
        run: |
          smctl healthcheck
          smctl windows certsync
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Build Tauri app (NSIS only, KeyLocker-signed)
        # NSIS-only + selective sign.cmd = 2 metered signatures per release
        # (app.exe + setup.exe). See ~/xeto-dev/windows-code-signing.md.
        shell: bash
        run: |
          signcmd="${GITHUB_WORKSPACE//\\//}/.github/sign.cmd"
          cat > release-win.conf.json <<EOF
          {
            "bundle": {
              "targets": ["nsis"],
              "windows": {
                "signCommand": "cmd /C $signcmd %1"
              }
            }
          }
          EOF
          npm run tauri build -- --config release-win.conf.json
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-artifacts
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download macOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-artifacts
          path: bundle

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-artifacts
          path: bundle/nsis

      - name: Generate latest.json
        run: |
          # download-artifact strips the common prefix: dmg/ + macos/ subdirs
          # survive for mac, nsis was placed explicitly.
          node app/scripts/make-latest-json.mjs \
            --bundle-dir "$PWD/bundle" \
            --out "$PWD/bundle/latest.json" \
            --notes "Clarity ${GITHUB_REF_NAME}"
          cat bundle/latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bundle/dmg/*.dmg \
            bundle/macos/*.app.tar.gz \
            bundle/nsis/*.exe \
            bundle/latest.json \
            --title "Clarity $GITHUB_REF_NAME" \
            --generate-notes
