# Manual test build of Clarity for Windows, Authenticode-signed via DigiCert
# KeyLocker (EV cert, cloud HSM).
#
# Produces NSIS/MSI installers as workflow artifacts only — no release, no
# latest.json, so existing installs never see an update banner from this.
# Trigger: gh workflow run windows-build.yml && gh run watch
# Fetch:   gh run download <run-id>

name: windows-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up DigiCert KeyLocker client cert
        shell: bash
        run: |
          echo "$SM_CLIENT_CERT_FILE_B64" | base64 -d > /d/client_cert.p12
          echo "SM_CLIENT_CERT_FILE=D:\\client_cert.p12" >> "$GITHUB_ENV"
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE }}

      - name: Install DigiCert KeyLocker tools
        uses: digicert/ssm-code-signing@v1.0.1
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: KeyLocker healthcheck + cert sync
        shell: cmd
        run: |
          smctl healthcheck
          smctl windows certsync
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Build Tauri app (signed, no updater artifacts)
        # createUpdaterArtifacts requires TAURI_SIGNING_PRIVATE_KEY; this is a
        # test build with no release/manifest, so disable it via override.
        shell: bash
        run: |
          cat > test-build.conf.json <<EOF
          {
            "bundle": {
              "createUpdaterArtifacts": false,
              "windows": {
                "signCommand": "smctl sign --fingerprint ${SM_CODE_SIGNING_CERT_SHA1_HASH} --input %1"
              }
            }
          }
          EOF
          npm run tauri build -- --config test-build.conf.json
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: clarity-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
