# Manual test build of Clarity for Windows (unsigned).
#
# Produces NSIS/MSI installers as workflow artifacts only — no release, no
# latest.json, so existing installs never see an update banner from this.
# Trigger: gh workflow run windows-build.yml && gh run watch
# Fetch:   gh run download <run-id>

name: windows-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: clarity-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
