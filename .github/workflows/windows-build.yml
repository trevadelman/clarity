# Manual test build of Clarity for Windows (unsigned).
#
# Produces NSIS/MSI installers as workflow artifacts only — no release, no
# latest.json, so existing installs never see an update banner from this.
# Trigger: gh workflow run windows-build.yml && gh run watch
# Fetch:   gh run download <run-id>

name: windows-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned, no updater artifacts)
        # createUpdaterArtifacts requires TAURI_SIGNING_PRIVATE_KEY; this is a
        # test build with no release/manifest, so disable it via override.
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > test-build.conf.json
          npm run tauri build -- --config test-build.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: clarity-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
