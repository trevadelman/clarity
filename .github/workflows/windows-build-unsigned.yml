# Unsigned test build of Clarity for Windows. No code signing, no metered
# DigiCert signatures consumed, no release, no latest.json — the installer
# is uploaded only as a workflow-run artifact for manual smoke testing
# (SmartScreen will warn "Unknown publisher" on first run; expected).
#
# Trigger: gh workflow run windows-build-unsigned.yml --ref <branch>
# Watch:   gh run watch
# Fetch:   gh run download <run-id>

name: windows-build-unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned, NSIS only, no updater artifacts)
        # No signCommand and no SM_* env — Tauri skips Authenticode signing.
        # createUpdaterArtifacts is disabled because it would require
        # TAURI_SIGNING_PRIVATE_KEY, and a test build ships no manifest.
        shell: bash
        run: |
          cat > test-build.conf.json <<EOF
          {
            "bundle": {
              "targets": ["nsis"],
              "createUpdaterArtifacts": false
            }
          }
          EOF
          npm run tauri build -- --config test-build.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: clarity-windows-unsigned-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
